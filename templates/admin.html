<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pixelcraft Solutions - Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1c23; color: #fff; padding: 40px; }
        .box { background: #21252b; padding: 30px; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #61afef; margin-top: 0; border-bottom: 2px solid #3e4451; padding-bottom: 10px; }
        .stat-box { background: #181a1f; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #3e4451; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #181a1f; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #3e4451; font-size: 0.95rem; }
        th { background: #282c34; color: #61afef; }
        a { color: #61afef; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #61afef; color: #1a1c23; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛡️ Creator & Admin Dashboard</h2>
        
        <div class="stat-box">
            📊 Gesamtanzahl registrierter Benutzer: <b>{{ total_users }}</b>
        </div>

        <h3>Registrierte User & Kontaktdaten:</h3>
        <table>
            <tr>
                <th>ID</th>
                <th>Benutzername</th>
                <th>Kontakt (E-Mail / Telefon)</th>
            </tr>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td><b>{{ u.username }}</b></td>
                <td>{{ u.contact }}</td>
            </tr>
            {% endfor %}
        </table>

        <a href="{{ url_for('index') }}" class="back-btn">← Zurück zum Dashboard</a>
    </div>
</body>
</html>
