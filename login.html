<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelcraft Solutions - Anmelden</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background-color: #313244;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        h2 { color: #89b4fa; margin-bottom: 10px; }
        p { color: #a6e3a1; font-size: 14px; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        input[type="email"], input[type="password"] {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #45475a;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .terms-box {
            font-size: 12px;
            color: #bac2de;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 5px;
            line-height: 1.4;
        }
        .terms-box input { margin-top: 2px; }
        button {
            padding: 12px;
            background-color: #89b4fa;
            border: none;
            border-radius: 5px;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        button:hover { background-color: #74c7ec; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Pixelcraft Solutions</h2>
        <p>Melde dich an, um den AI-Chat zu nutzen</p>
        <form method="POST">
            <input type="email" name="email" placeholder="E-Mail-Adresse" required>
            <input type="password" name="passwort" placeholder="Passwort" required>
            
            <div class="terms-box">
                <input type="checkbox" name="bedingungen" required>
                <label>Ich akzeptiere die Bedingungen: Deine E-Mail wird gespeichert, sodass wir dir jederzeit eine E-Mail bei News senden können. Wir sind verpflichtet, deine E-Mail niemanden weiterzugeben oder was damit zu machen. Wir teilen unsere Produkte mit keinem Drittanbieter.</label>
            </div>

            <button type="submit">Kostenlos starten</button>
        </form>
    </div>
</body>
</html>
